name: WinUI 3 Preview

# Expensive native cross-compilation is manual-only.
# The native binary is cached by native build inputs; managed edits reuse it.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: winui3-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-managed:
    name: Validate WinUI before native compilation
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile and publish managed frontend
        shell: pwsh
        run: |
          dotnet publish win/CS/HandBrake.WinUI/HandBrake.WinUI.csproj --configuration Release --runtime win-x64 --self-contained false -p:Platform=x64 -p:WindowsAppSDKSelfContained=false --output "$env:RUNNER_TEMP/managed-preflight"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-libhb-x64:
    needs: validate-managed
    name: Cross-compile matching libhb x64
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout this exact HandBrake fork revision
        uses: actions/checkout@v4

      - name: Restore native library cache
        id: native-cache
        uses: actions/cache@v4
        with:
          path: native-output/hb.dll
          key: libhb-win-x64-ucrt-v2-${{ hashFiles('libhb/**', 'contrib/**', 'make/**', 'configure', 'scripts/**') }}

      - name: Recover verified native artifact from baseline build
        id: native-previous
        if: steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline=14dc807626a68c84d3c2faae35e921af2295945f
          git fetch --depth=1 origin "$baseline"
          # Managed wrappers do not affect hb.dll. Compare native build inputs only.
          if ! git diff --quiet "$baseline" HEAD -- libhb contrib make configure scripts; then
            echo "hit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p native-output
          recovery="$RUNNER_TEMP/native-recovery"
          mkdir -p "$recovery"
          if gh run download 40966331081 --repo "$GITHUB_REPOSITORY" --name HandBrake-WinUI3-FrameworkDependent-x64 --dir "$recovery" && test -s "$recovery/hb.dll"; then
            cp "$recovery/hb.dll" native-output/hb.dll
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            rm -f native-output/hb.dll
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore immutable native library release if cache is missing
        id: native-release
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.native-previous.outputs.hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_HASH: ${{ hashFiles('libhb/**', 'contrib/**', 'make/**', 'configure', 'scripts/**') }}
        run: |
          set -euo pipefail
          mkdir -p native-output
          tag="native-libhb-x64-${NATIVE_HASH}"
          if gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern hb.dll --dir native-output; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Restored matching native libhb from release $tag"
          else
            rm -f native-output/hb.dll
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "No matching persistent native asset; a source build is required."
          fi

      - name: Install cross-build dependencies
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.native-previous.outputs.hit != 'true' && steps.native-release.outputs.hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint build-essential bison bzip2 clang cmake curl flex g++ gcc git gzip libssl-dev libtool libtool-bin m4 make meson nasm ninja-build patch pax pkg-config tar zlib1g-dev
          rustup target add x86_64-pc-windows-gnu

      - name: Install cargo-c
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.native-previous.outputs.hit != 'true' && steps.native-release.outputs.hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-cbuild >/dev/null 2>&1; then
            cargo install cargo-c --locked
          fi

      - name: Download verified HandBrake MinGW x64 toolchain
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.native-previous.outputs.hit != 'true' && steps.native-release.outputs.hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/HandBrake/HandBrake-toolchains/releases/download/1.0/mingw-w64-toolchain-12.0.0-ucrt-linux-x86_64.tar.gz"
          curl --fail --location --retry 3 "$url" --output "$RUNNER_TEMP/mingw-x64.tar.gz"
          echo "43abbe33e79d273da2cd102fe45e196b56b5bc92  $RUNNER_TEMP/mingw-x64.tar.gz" | sha1sum -c -
          mkdir -p "$GITHUB_WORKSPACE/toolchains"
          tar -xzf "$RUNNER_TEMP/mingw-x64.tar.gz" -C "$GITHUB_WORKSPACE/toolchains"

      - name: Build libhb from the same checkout
        if: steps.native-cache.outputs.cache-hit != 'true' && steps.native-previous.outputs.hit != 'true' && steps.native-release.outputs.hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchains/mingw-w64-toolchain-12.0.0-ucrt-linux-x86_64/mingw-w64-x86_64/bin:$PATH"
          ./configure --cross=x86_64-w64-mingw32 --launch-jobs="$(nproc)" --launch
          test -s build/libhb/hb.dll
          mkdir -p native-output
          cp build/libhb/hb.dll native-output/hb.dll

      - name: Verify matching native library
        shell: bash
        run: |
          set -euo pipefail
          test -s native-output/hb.dll
          file native-output/hb.dll
          sha256sum native-output/hb.dll

      - name: Publish persistent native library asset
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_HASH: ${{ hashFiles('libhb/**', 'contrib/**', 'make/**', 'configure', 'scripts/**') }}
        run: |
          set -euo pipefail
          tag="native-libhb-x64-${NATIVE_HASH}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" native-output/hb.dll --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" native-output/hb.dll --repo "$GITHUB_REPOSITORY" \
              --title "HandBrake native x64 ${NATIVE_HASH:0:12}" \
              --notes "Reusable x64 libhb for HandBrake-WinUI. Native source fingerprint: ${NATIVE_HASH}. Generated by the repository's full WinUI preview workflow." \
              --prerelease --target "$GITHUB_SHA"
          fi

      - name: Transfer libhb to the Windows publish job
        uses: actions/upload-artifact@v4
        with:
          name: winui3-native-libhb-x64
          path: native-output/hb.dll
          if-no-files-found: error
          retention-days: 1

  publish-winui-x64:
    name: Publish WinUI 3 x64 with native scanner
    needs: build-libhb-x64
    runs-on: windows-2025
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish unpackaged WinUI preview
        shell: pwsh
        run: |
          dotnet publish win/CS/HandBrake.WinUI/HandBrake.WinUI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=false `
            --output "$env:RUNNER_TEMP/HandBrake-WinUI3"

      - name: Download native libhb from this workflow run
        uses: actions/download-artifact@v4
        with:
          name: winui3-native-libhb-x64
          path: ${{ runner.temp }}/HandBrake-WinUI3

      - name: Verify native scanner and framework-dependent publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "HandBrake-WinUI3"
          $requiredFiles = @(
            "HandBrake.WinUI.exe",
            "HandBrake.WinUI.pri",
            "HandBrake.Interop.dll",
            "HandBrake.WinUI.runtimeconfig.json",
            "hb.dll"
          )
          foreach ($file in $requiredFiles) {
            $fullPath = Join-Path $publishDir $file
            if (-not (Test-Path -LiteralPath $fullPath)) {
              throw "Missing published dependency: $file"
            }
            Write-Host "OK: $file"
          }
          # Framework-dependent .NET/Windows App SDK: do not ship the runtimes.
          if (Test-Path (Join-Path $publishDir "coreclr.dll")) {
            throw "Unexpected bundled .NET runtime (coreclr.dll)"
          }
          $runtimeConfig = Get-Content (Join-Path $publishDir "HandBrake.WinUI.runtimeconfig.json") -Raw | ConvertFrom-Json
          if (-not $runtimeConfig.runtimeOptions.framework -and -not $runtimeConfig.runtimeOptions.frameworks) {
            throw "Missing framework dependency in runtimeconfig.json"
          }
          # Verify PE Machine == AMD64; reject accidental ARM or 32-bit libhb.
          $dll = Join-Path $publishDir "hb.dll"
          $stream = [System.IO.File]::OpenRead($dll)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Seek(0x3c, [System.IO.SeekOrigin]::Begin) | Out-Null
            $peOffset = $reader.ReadInt32()
            $stream.Seek($peOffset, [System.IO.SeekOrigin]::Begin) | Out-Null
            if ($reader.ReadUInt32() -ne 0x00004550) { throw "Invalid PE signature: hb.dll" }
            if ($reader.ReadUInt16() -ne 0x8664) { throw "hb.dll is not x64" }
          }
          finally { $stream.Dispose() }
          # New managed wrappers use existing libhb APIs; verify the restored
          # DLL exports them before publishing a package that cannot initialize.
          $handle = [System.Runtime.InteropServices.NativeLibrary]::Load($dll)
          try {
            $symbols = @(
              "hb_presets_builtin_get", "hb_preset_job_init", "hb_value_json",
              "hb_value_free", "hb_value_type", "hb_dict_iter_init", "hb_dict_iter_next",
              "hb_dict_iter_key", "hb_dict_iter_value", "hb_value_array_len",
              "hb_value_array_get", "hb_value_get_string", "hb_value_get_int",
              "hb_value_get_double", "hb_value_get_bool"
            )
            foreach ($symbol in $symbols) {
              [System.Runtime.InteropServices.NativeLibrary]::GetExport($handle, $symbol) | Out-Null
            }
          }
          finally { [System.Runtime.InteropServices.NativeLibrary]::Free($handle) }

      - name: Upload integrated preview folder
        uses: actions/upload-artifact@v4
        with:
          name: HandBrake-WinUI3-FrameworkDependent-x64
          path: ${{ runner.temp }}/HandBrake-WinUI3/
          if-no-files-found: error
          retention-days: 2
