name: WinUI 3 Preview

# Large x64 self-contained artifacts are intentionally opt-in during UI development.
# Use Actions > WinUI 3 Preview > Run workflow when a test build is needed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-winui-x64:
    name: Publish WinUI 3 x64 shell
    runs-on: windows-2025

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish unpackaged preview
        shell: pwsh
        run: |
          dotnet publish win/CS/HandBrake.WinUI/HandBrake.WinUI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:WindowsAppSDKSelfContained=true `
            --output "$env:RUNNER_TEMP/HandBrake-WinUI3"

      - name: Verify app-specific WinUI XAML resources are included
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "HandBrake-WinUI3"
          $requiredFiles = @("HandBrake.WinUI.exe", "HandBrake.WinUI.pri", "Microsoft.ui.xaml.dll")
          foreach ($file in $requiredFiles) {
            $fullPath = Join-Path $publishDir $file
            if (-not (Test-Path -LiteralPath $fullPath)) {
              throw "Published output is missing required file: $file. XAML may fail on startup."
            }
            Write-Host "OK: $file"
          }

      - name: Upload preview folder
        uses: actions/upload-artifact@v4
        with:
          name: HandBrake-WinUI3-Shell-x64
          path: ${{ runner.temp }}/HandBrake-WinUI3/
          if-no-files-found: error
          retention-days: 2
